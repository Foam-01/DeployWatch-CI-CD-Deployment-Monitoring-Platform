name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://test:test@localhost:5433/deploywatch_test

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      db-test:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deploywatch_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d deploywatch_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -w apps/api

      - name: Apply migrations to test database
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: npm run test:integration -w apps/api

      - name: Build API and Web
        run: npm run build

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
