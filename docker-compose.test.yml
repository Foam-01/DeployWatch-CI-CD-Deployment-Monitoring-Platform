# Disposable Postgres for integration and E2E tests.
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
services:
  db-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: deploywatch_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d deploywatch_test']
      interval: 2s
      timeout: 3s
      retries: 15
